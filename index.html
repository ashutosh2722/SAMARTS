
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="SamArts creates thoughtful personalised gifts, keepsakes and little reminders of love.">
  <title>SamArts | Thoughtful Gifts, Beautifully Made</title>

  <style>
    :root {
      --ivory: #f8f5ef;
      --paper: #fffdf9;
      --burgundy: #651d32;
      --burgundy-dark: #481324;
      --gold: #b79a62;
      --ink: #282321;
      --muted: #827873;
      --line: #e9e1d8;
      --green: #466b53;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .announcement {
      background: var(--burgundy);
      color: white;
      text-align: center;
      padding: 10px 12px;
      font-size: 11px;
      letter-spacing: 1.4px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,253,249,.97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .header-main {
      max-width: 1440px;
      margin: auto;
      padding: 16px 5%;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      align-items: center;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      white-space: nowrap;
      width: fit-content;
    }

    .brand-sam {
      color: var(--burgundy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: normal;
      letter-spacing: -2px;
    }

    .brand-arts {
      color: var(--gold);
      font-family: Arial, sans-serif;
      font-size: 19px;
      font-weight: 300;
      letter-spacing: 3px;
    }

    .search-wrap { position: relative; }

    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--ivory);
      padding: 13px 15px 13px 42px;
      outline: none;
      font-size: 13px;
    }

    .search-wrap input:focus { border-color: var(--gold); }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 12px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
    }

    .icon-button {
      border: 0;
      background: transparent;
      color: var(--burgundy);
      font-size: 13px;
      padding: 6px 0;
      white-space: nowrap;
    }

    .count {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 19px;
      height: 19px;
      margin-left: 3px;
      padding: 0 5px;
      border-radius: 50px;
      background: var(--burgundy);
      color: white;
      font-size: 10px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 0 15px 14px;
      flex-wrap: wrap;
    }

    .nav a, .nav button {
      color: #554b47;
      font-size: 11px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      border: 0;
      background: none;
    }

    .nav a:hover, .nav button:hover { color: var(--burgundy); }

    .hero {
      background: var(--ivory);
      min-height: 470px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      overflow: hidden;
    }

    .hero-copy {
      padding: 72px 9% 70px 12%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 22px;
    }

    h1, h2, h3, p { margin-top: 0; }

    .hero h1 {
      max-width: 560px;
      margin-bottom: 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5vw, 65px);
      line-height: 1.08;
      font-weight: normal;
      color: var(--burgundy-dark);
    }

    .hero-copy > p:not(.eyebrow) {
      max-width: 430px;
      color: #766b65;
      line-height: 1.9;
      font-size: 14px;
    }

    .primary-button {
      display: inline-block;
      border: 1px solid var(--burgundy);
      background: var(--burgundy);
      color: white;
      padding: 15px 24px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: .2s;
    }

    .primary-button:hover {
      background: var(--burgundy-dark);
      border-color: var(--burgundy-dark);
    }

    .secondary-button {
      display: inline-block;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--burgundy);
      padding: 13px 18px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero-art {
      min-height: 410px;
      background:
        radial-gradient(ellipse at 65% 40%, rgba(183,154,98,.18), transparent 38%),
        linear-gradient(135deg, #e9ded0, #d8c2ae 55%, #f4e9da);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .hero-card {
      width: min(310px, 100%);
      aspect-ratio: 4 / 5;
      background: #f9f4e9;
      box-shadow: 0 22px 65px rgba(72,19,36,.17);
      border: 1px solid rgba(183,154,98,.7);
      padding: 18px;
      transform: rotate(2deg);
    }

    .hero-card-inner {
      height: 100%;
      border: 1px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .hero-card .small {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 25px;
    }

    .hero-card .script {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 3vw, 42px);
      font-style: italic;
      line-height: 1.2;
      color: var(--burgundy);
    }

    .hero-card .ornament {
      margin: 24px 0 15px;
      color: var(--gold);
      font-size: 25px;
    }

    .hero-card .bottom {
      font-size: 9px;
      letter-spacing: 2px;
      color: #817064;
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      padding: 24px 5%;
      gap: 18px;
    }

    .benefit {
      text-align: center;
      font-size: 11px;
      color: #766b65;
      letter-spacing: .6px;
    }

    .benefit strong {
      display: block;
      color: var(--burgundy);
      font-size: 12px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .section {
      max-width: 1440px;
      margin: auto;
      padding: 76px 5%;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 38px;
    }

    .section-heading .eyebrow { margin-bottom: 12px; }

    .section-heading h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 4vw, 43px);
      font-weight: normal;
      color: var(--burgundy-dark);
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      max-width: 560px;
      margin: auto;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .category-tile {
      min-height: 155px;
      padding: 24px 12px;
      border: 1px solid var(--line);
      background: var(--ivory);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: .2s;
      color: var(--burgundy);
    }

    .category-tile:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .category-symbol {
      font-family: Georgia, serif;
      font-size: 29px;
      color: var(--gold);
      margin-bottom: 15px;
    }

    .category-tile strong {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .category-tile span:last-child {
      font-size: 11px;
      color: var(--muted);
    }

    .story {
      background: var(--ivory);
      padding: 65px 8%;
      text-align: center;
    }

    .story-inner { max-width: 780px; margin: auto; }

    .story h2 {
      font-family: Georgia, serif;
      color: var(--burgundy);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: normal;
      line-height: 1.2;
    }

    .story p {
      color: #776b64;
      font-size: 14px;
      line-height: 2;
    }

    .shop-layout {
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr);
      gap: 34px;
      align-items: start;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding-right: 22px;
      position: sticky;
      top: 150px;
    }

    .sidebar h3 {
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--burgundy);
      margin: 0 0 18px;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 30px;
    }

    .category-filter {
      text-align: left;
      border: 0;
      background: transparent;
      padding: 11px 10px;
      color: #756b66;
      font-size: 12px;
      border-radius: 2px;
    }

    .category-filter.active, .category-filter:hover {
      background: var(--ivory);
      color: var(--burgundy);
      font-weight: bold;
    }

    .sidebar-note {
      border: 1px solid var(--line);
      padding: 17px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .sidebar-note strong {
      display: block;
      color: var(--burgundy);
      margin-bottom: 7px;
    }

    .shop-main { min-width: 0; }

    .shop-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 23px;
      flex-wrap: wrap;
    }

    .shop-toolbar h2 {
      font-family: Georgia, serif;
      color: var(--burgundy);
      font-size: 28px;
      font-weight: normal;
      margin: 0;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-right label {
      color: var(--muted);
      font-size: 11px;
    }

    .toolbar-right select {
      border: 1px solid var(--line);
      padding: 10px;
      background: white;
      color: var(--ink);
      font-size: 12px;
      max-width: 180px;
    }

    .mobile-categories { display: none; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px 17px;
    }

    .product-card { min-width: 0; }

    .product-image-wrap {
      position: relative;
      overflow: hidden;
      background: var(--ivory);
      aspect-ratio: 4 / 5;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s;
    }

    .product-card:hover .product-image { transform: scale(1.035); }

    .product-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 7px 8px;
      background: rgba(255,253,249,.94);
      color: var(--burgundy);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .wishlist-button {
      position: absolute;
      top: 9px;
      right: 9px;
      border: 0;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      background: rgba(255,253,249,.95);
      color: var(--burgundy);
      font-size: 19px;
    }

    .wishlist-button.saved { color: #b21f45; }

    .product-info { padding: 14px 2px 0; }

    .product-category {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .product-name {
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.35;
      font-weight: normal;
      margin-bottom: 7px;
      color: var(--ink);
    }

    .product-description {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
      min-height: 37px;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 14px;
      color: var(--burgundy);
      font-weight: bold;
      margin-bottom: 13px;
    }

    .add-button {
      width: 100%;
      border: 1px solid var(--burgundy);
      color: var(--burgundy);
      background: transparent;
      padding: 12px 7px;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: .2s;
    }

    .add-button:hover {
      background: var(--burgundy);
      color: white;
    }

    .no-results {
      display: none;
      text-align: center;
      padding: 45px 10px;
      color: var(--muted);
      line-height: 1.8;
    }

    .personalise {
      background: var(--burgundy-dark);
      color: white;
      padding: 65px 8%;
      text-align: center;
    }

    .personalise .eyebrow { color: #d8bd87; }

    .personalise h2 {
      font-family: Georgia, serif;
      font-size: clamp(29px, 4vw, 43px);
      font-weight: normal;
      margin-bottom: 16px;
    }

    .personalise p {
      max-width: 600px;
      margin: 0 auto 25px;
      color: #e4d6d3;
      font-size: 13px;
      line-height: 1.9;
    }

    .personalise .primary-button {
      background: transparent;
      border-color: #d8bd87;
      color: white;
    }

    footer {
      background: #f2ece3;
      padding: 45px 5% 20px;
    }

    .footer-grid {
      max-width: 1300px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 35px;
      padding-bottom: 30px;
    }

    .footer-grid h3 {
      font-family: Georgia, serif;
      color: var(--burgundy);
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 14px;
    }

    .footer-grid p, .footer-grid a {
      font-size: 12px;
      color: #776b64;
      line-height: 1.9;
    }

    .footer-links { display: flex; flex-direction: column; gap: 6px; }

    .copyright {
      border-top: 1px solid #ded4c8;
      text-align: center;
      padding-top: 18px;
      font-size: 10px;
      color: #877b73;
      letter-spacing: .5px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(25,16,18,.48);
    }

    .overlay.open { display: block; }

    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: min(440px, 100%);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0,0,0,.1);
    }

    .drawer-header {
      padding: 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      margin: 0;
      color: var(--burgundy);
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 25px;
    }

    .close-button {
      border: 0;
      background: transparent;
      font-size: 25px;
      color: var(--burgundy);
      padding: 3px 8px;
    }

    .drawer-content { padding: 20px; overflow-y: auto; flex: 1; }

    .empty-state {
      text-align: center;
      padding: 45px 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 13px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      align-items: start;
    }

    .cart-item img {
      width: 72px;
      height: 90px;
      object-fit: cover;
      background: var(--ivory);
    }

    .cart-item h3 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 16px;
      margin: 2px 0 7px;
    }

    .cart-item p { color: var(--burgundy); font-size: 12px; margin-bottom: 10px; }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .quantity button {
      background: var(--ivory);
      border: 1px solid var(--line);
      width: 25px;
      height: 25px;
      color: var(--burgundy);
    }

    .remove-button {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 10px;
      text-decoration: underline;
      margin-top: 9px;
      padding: 0;
    }

    .cart-item-total { font-size: 12px; font-weight: bold; white-space: nowrap; }

    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--line);
      background: white;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      color: var(--burgundy);
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .checkout-note {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .drawer-footer .primary-button {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .drawer-footer .secondary-button {
      width: 100%;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--burgundy-dark);
      color: white;
      padding: 13px 20px;
      font-size: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
      display: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show { display: block; }

    @media (max-width: 900px) {
      .header-main { grid-template-columns: 1fr auto; gap: 12px; }
      .search-wrap { grid-column: 1 / -1; grid-row: 2; }
      .header-actions { grid-column: 2; grid-row: 1; }
      .brand-sam { font-size: 30px; }
      .hero-copy { padding: 55px 8%; }
      .hero-art { min-height: 360px; padding: 25px; }
      .shop-layout { grid-template-columns: 165px minmax(0,1fr); gap: 22px; }
      .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .category-grid { grid-template-columns: repeat(2,1fr); }
    }

    @media (max-width: 600px) {
      .announcement { font-size: 9px; letter-spacing: 1px; }
      .header-main { padding: 13px 4%; }
      .brand-sam { font-size: 27px; }
      .brand-arts { font-size: 15px; letter-spacing: 2px; }
      .header-actions { gap: 13px; }
      .icon-button { font-size: 12px; }
      .nav { gap: 17px; padding: 0 8px 13px; }
      .nav a, .nav button { font-size: 9px; letter-spacing: .8px; }
      .hero { grid-template-columns: 1fr; }
      .hero-copy { padding: 50px 8% 42px; }
      .hero h1 { font-size: 43px; }
      .hero-art { min-height: 300px; }
      .hero-card { width: 215px; }
      .benefits { padding: 20px 4%; gap: 8px; }
      .benefit { font-size: 9px; line-height: 1.5; }
      .benefit strong { font-size: 10px; }
      .section { padding: 54px 4%; }
      .category-tile { min-height: 130px; padding: 17px 8px; }
      .story { padding: 50px 7%; }
      .shop-layout { display: block; }
      .sidebar { display: none; }
      .mobile-categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 3px 0 18px;
        margin-bottom: 6px;
      }
      .mobile-categories button {
        flex: 0 0 auto;
        padding: 10px 13px;
        background: var(--ivory);
        border: 1px solid var(--line);
        color: #665a54;
        font-size: 10px;
        white-space: nowrap;
      }
      .mobile-categories button.active {
        background: var(--burgundy);
        color: white;
        border-color: var(--burgundy);
      }
      .shop-toolbar h2
